function analyzeFiles(){
  var inp=document.getElementById("refile");
  var out=document.getElementById("reout");
  if(!inp||!out||!inp.files.length){say("Select one or more files first");return}
  out.innerHTML="<div class=\"m\">Analyzing…</div>";
  var results=[];
  var pending=inp.files.length;
  Array.prototype.forEach.call(inp.files,function(f){
    var reader=new FileReader();
    reader.onload=function(e){
      var buf=e.target.result;
      var bytes=new Uint8Array(buf);
      var strings=[];
      var cur="";
      for(var i=0;i<bytes.length&&strings.length<800;i++){
        var c=bytes[i];
        if(c>=32&&c<127){cur+=String.fromCharCode(c)}
        else{if(cur.length>=6)strings.push(cur);cur=""}
      }
      if(cur.length>=6)strings.push(cur);
      var info="File: "+f.name+" ("+f.size+" bytes)\n";
      info+="Magic: "+(bytes.slice(0,8).reduce(function(s,b){return s+b.toString(16).padStart(2,"0")+" "},"")||"n/a")+"\n";
      info+="Strings found: "+strings.length+" (showing up to 40)\n";
      info+=strings.slice(0,40).join("\n");
      if(strings.length>40)info+="\n... ("+(strings.length-40)+" more)";
      results.push(info);
      pending--;
      if(pending===0){
        out.innerHTML=results.map(function(r){return '<div class="msg"><pre>'+esc(r)+'</pre></div>'}).join("");
        say("Analysis complete");
      }
    };
    reader.onerror=function(){results.push("Failed to read "+f.name);pending--;if(pending===0)out.innerHTML=results.join("<hr>")};
    reader.readAsArrayBuffer(f);
  });
}
